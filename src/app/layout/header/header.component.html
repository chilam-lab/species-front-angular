<header class="app-header">
  <button class="hamburger" (click)="onToggleClick()" [attr.aria-label]="'app.menu' | t">☰</button>
  <div class="titles">
    <h1>{{ title | t }}</h1>
    <h2>{{ subtitle | t }}</h2>
  </div>

  <div class="header-right">
    <!-- Reporte de incidencias (crea un issue en GitHub; pide sesión dentro del diálogo). -->
    <button type="button" class="report-btn" (click)="reportOpen = true"
            [title]="'rep.open' | t" [attr.aria-label]="'rep.open' | t">
      <span class="material-icons" aria-hidden="true">bug_report</span>
    </button>

    <!-- Idioma: disponible con o sin sesión; se recuerda en el navegador
         (y en el perfil si hay sesión, desde Mi cuenta). -->
    <div class="lang-switch" role="group" [attr.aria-label]="'app.language' | t">
      <button type="button" *ngFor="let l of langs"
              [class.active]="i18n.lang() === l.code"
              [attr.aria-pressed]="i18n.lang() === l.code"
              (click)="setLang(l.code)">{{ l.label }}</button>
    </div>

    <!-- Cuenta: nombre si hay sesión; si no, accesos a iniciar sesión / registrarse. -->
    <div class="account" *ngIf="(currentUser$ | async) as user; else guest">
      <a routerLink="/perfil" class="account-link" [title]="user.email">
        <span class="material-icons" aria-hidden="true">account_circle</span>
        <span class="account-name">{{ user.name }}</span>
      </a>
    </div>
    <ng-template #guest>
      <div class="account guest">
        <span class="guest-hint">{{ 'app.noSession' | t }}</span>
        <a routerLink="/login" class="btn-link">{{ 'app.login' | t }}</a>
        <a routerLink="/register" class="btn-link primary">{{ 'app.register' | t }}</a>
      </div>
    </ng-template>
  </div>
</header>

<app-report-issue-dialog *ngIf="reportOpen" (closed)="reportOpen = false"></app-report-issue-dialog>
