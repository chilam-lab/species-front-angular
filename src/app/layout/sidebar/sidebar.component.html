<nav class="sidebar" [class.collapsed]="collapsed">
  <ul>
    <li>
      <a routerLink="/nicho-ecologico/target">
        <span class="material-icons">eco</span>
        <span *ngIf="!collapsed">{{ 'nav.niche' | t }}</span>
      </a>
    </li>
    <li>
      <a href="#">
        <span class="material-icons">account_tree</span>
        <span *ngIf="!collapsed">{{ 'nav.networks' | t }}</span>
      </a>
    </li>
    <li>
      <a href="#">
        <span class="material-icons">analytics</span>
        <span *ngIf="!collapsed">{{ 'nav.cases' | t }}</span>
      </a>
    </li>
    <li>
      <a href="javascript:void(0)" (click)="cycleLang()" [title]="'app.language' | t">
        <span class="material-icons">language</span>
        <span *ngIf="!collapsed">{{ 'nav.language' | t }}: {{ i18n.lang().toUpperCase() }}</span>
      </a>
    </li>
    <li>
      <ng-container *ngIf="(currentUser$ | async) as user; else loginLink">
        <a routerLink="/perfil">
          <span class="material-icons">account_circle</span>
          <span *ngIf="!collapsed">{{ user.name }}</span>
        </a>
      </ng-container>
      <ng-template #loginLink>
        <a routerLink="/login">
          <span class="material-icons">login</span>
          <span *ngIf="!collapsed">{{ 'nav.login' | t }}</span>
        </a>
      </ng-template>
    </li>
  </ul>
</nav>
