<div class="auth-card">
  <h1>Iniciar sesión</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Correo
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <div class="field-error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
      Ingresa un correo válido.
    </div>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <div class="field-error" *ngIf="form.controls['password'].touched && form.controls['password'].invalid">
      La contraseña es obligatoria.
    </div>

    <label class="checkbox">
      <input type="checkbox" formControlName="aviso" />
      Acepto el aviso de privacidad y términos de uso.
    </label>

    <div class="field-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="auth-links">
    ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
  </p>
  <p class="auth-links">
    <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
  </p>
</div>
