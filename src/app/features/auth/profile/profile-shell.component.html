<div class="profile-shell" *ngIf="user$ | async as user">
  <header class="profile-header">
    <div>
      <h1>{{ 'prof.title' | t }}</h1>
      <p class="subtitle">{{ user.name }} · {{ user.email }}</p>
    </div>
    <button type="button" class="logout" (click)="logout()">{{ 'prof.logout' | t }}</button>
  </header>

  <nav class="tabs">
    <a routerLink="/perfil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'prof.tab.profile' | t }}</a>
    <a routerLink="seguridad" routerLinkActive="active">{{ 'prof.tab.security' | t }}</a>
    <a routerLink="historial" routerLinkActive="active">{{ 'prof.tab.history' | t }}</a>
    <a routerLink="mis-datos" routerLinkActive="active">{{ 'prof.tab.data' | t }}</a>
  </nav>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>
</div>
