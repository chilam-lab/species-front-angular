<div class="auth-card">
  <h1>Recuperar contraseña</h1>
  <p class="hint">Te enviaremos una contraseña temporal a tu correo.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Correo
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <div class="field-error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
      Ingresa un correo válido.
    </div>

    <div class="field-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="field-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Enviando…' : 'Enviar' }}
    </button>
  </form>

  <p class="auth-links">
    <a routerLink="/login">Volver a iniciar sesión</a>
  </p>
</div>
