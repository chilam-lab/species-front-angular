<div class="auth-card">
  <h1>{{ 'auth.forgot.title' | t }}</h1>
  <p class="hint">{{ 'auth.forgot.hint' | t }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'auth.email' | t }}
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <div class="field-error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
      {{ 'auth.emailInvalid' | t }}
    </div>

    <div class="field-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="field-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="submitting">
      {{ (submitting ? 'auth.forgot.submitting' : 'auth.forgot.submit') | t }}
    </button>
  </form>

  <p class="auth-links">
    <a routerLink="/login">{{ 'auth.forgot.back' | t }}</a>
  </p>
</div>
