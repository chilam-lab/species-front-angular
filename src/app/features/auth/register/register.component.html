<div class="auth-card">
  <h1>Crear cuenta</h1>

  <div *ngIf="success; else formTpl" class="success-box">
    Cuenta creada correctamente. Ya puedes <a routerLink="/login">iniciar sesión</a>.
  </div>

  <ng-template #formTpl>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Nombre
        <input type="text" formControlName="nombre" autocomplete="name" />
      </label>

      <label>
        Correo
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <div class="field-error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
        Ingresa un correo válido.
      </div>

      <label>
        Procedencia (institución, opcional)
        <input type="text" formControlName="procedencia" />
      </label>

      <label>
        Contraseña
        <div class="password-field">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" />
          <button type="button" class="toggle-visibility" (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <span class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </label>
      <div class="field-error" *ngIf="form.controls['password'].touched && form.controls['password'].invalid">
        6-12 caracteres, con mayúscula, minúscula y un número, sin espacios.
      </div>

      <label class="checkbox">
        <input type="checkbox" formControlName="aviso" />
        Acepto el aviso de privacidad y términos de uso.
      </label>
      <div class="field-error" *ngIf="form.controls['aviso'].touched && form.controls['aviso'].invalid">
        Debes aceptar el aviso de privacidad y los términos de uso para continuar.
      </div>

      <div class="field-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-links">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </ng-template>
</div>
