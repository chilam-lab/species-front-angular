<div class="nicho-shell">
  <div class="nicho-shell__header">
    <nicho-stepper [steps]="steps" (stepClick)="onStepClick($event)"></nicho-stepper>

    <div class="nicho-shell__step-meta">
      <h1>{{ currentStepMeta.title | t }}</h1>
      <p>{{ currentStepMeta.description | t }}</p>
    </div>
  </div>

  <router-outlet></router-outlet>
</div>
